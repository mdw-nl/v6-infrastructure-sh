name: Vantage6 Infrastructure Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  vantage6-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: CI
      UI_ENABLED: false
      PYTHON_INTERPRETER: python3.12
      VERSION_VANTAGE6: 4.14.0

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Preflight
        run: |
          cd infrastructure
          chmod +x infra.sh setup.sh shutdown.sh
          ./infra.sh preflight

      - name: Start infrastructure
        run: |
          cd infrastructure
          ./infra.sh up

      - name: Infrastructure Tests
        run: |
          cd infrastructure
          ./infra.sh test

      - name: Tear down vantage6
        if: always()
        run: |
          cd infrastructure
          ./infra.sh down

      - name: Confirm containers are removed
        if: always()
        run: docker ps -a

  notify-dependabot-failure:
    needs: [vantage6-demo]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: "@tim-hendriks"
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_URL" --body "$NOTIFY CI failed on this dependency update: $RUN_URL"
