name: Build and Publish Algorithm Images

# Builds every algorithms/<name>/Dockerfile. Only pushes to GHCR when the
# ref being built is actually refs/heads/main - this covers push-to-main,
# and also guards workflow_dispatch (which lets you pick ANY branch to run
# against from the Actions UI) from publishing images off a WIP branch.
# Everything else (PRs, workflow_dispatch on a non-main branch) is a
# build-only smoke check - no push, no registry login attempted.
#
# NOTE on visibility: GHCR often defaults a brand-new package to private
# on its first push regardless of the source repo's own visibility, which
# would need a one-time manual fix per package (Organization -> Packages
# -> <algorithm name> -> Package settings -> Change visibility -> Public).
# Verified after this workflow's first run against the mdw-nl org that it
# was NOT needed here - all 7 images came up publicly pullable with no
# extra step (an anonymous `docker pull`/registry token check against each
# one succeeded). Leaving this note in case that ever changes (e.g. an org
# policy change, or a new algorithm added under different circumstances) -
# if a future image comes up private, this is the fix.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "algorithms/**"
      - ".github/workflows/build-algorithm-images.yaml"
  push:
    branches: ["main"]
    paths:
      - "algorithms/**"
      - ".github/workflows/build-algorithm-images.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mdw-nl/v6-infrastructure-sh

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        algorithm:
          - average
          - logistic_regression
          - admm_logistic_regression
          - argos_cnn
          - coxph
          - fed_statistics
          - kaplan_meier

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.algorithm }} (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: algorithms/${{ matrix.algorithm }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.algorithm }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.algorithm }}:${{ github.sha }}
