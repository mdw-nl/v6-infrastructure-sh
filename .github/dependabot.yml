version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/data/datavalgen"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "pip"
    directory: "/infrastructure"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "docker"
    directories:
      - "/algorithms/*"
      - "/data/datavalgen"
      - "/data/datavalgen/v6-validate"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
